<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星辉远征录 - 在线文字冒险</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <h1>✨ 星辉远征录</h1>
        <p>在线文字探索冒险 · 奇幻世界 · 持续扩展中</p>
      </header>

      <section class="status-panel" aria-label="角色状态">
        <div><strong>生命</strong><span id="hp">10</span></div>
        <div><strong>金币</strong><span id="gold">0</span></div>
        <div><strong>魔力</strong><span id="mana">3</span></div>
        <div><strong>地点</strong><span id="location">晨雾村</span></div>
      </section>

      <section class="scene-panel">
        <img id="scene-image" src="assets/village.svg" alt="当前场景插图" />
        <article>
          <h2 id="scene-title">晨雾村</h2>
          <p id="scene-text"></p>
        </article>
      </section>

      <section class="choices-panel" id="choices" aria-label="可选行动"></section>

      <section class="inventory-panel">
        <h3>🎒 背包</h3>
        <ul id="inventory-list"></ul>
      </section>

      <section class="log-panel">
        <h3>📜 冒险日志</h3>
        <ul id="log-list"></ul>
      </section>

      <footer class="game-footer">
        <button id="restart-btn" type="button">重新开始</button>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
